name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          # Omni deliberately has no external Go modules or go.sum file.
          cache: false

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Build release binaries
        id: build
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          mkdir -p dist
          while read -r goos goarch; do
            asset="omni_${goos}_${goarch}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X github.com/toppk/omni/internal/app.Version=$tag" \
              -o "dist/$asset" ./cmd/omni
            sha256sum "dist/$asset" > "dist/$asset.sha256"
          done <<'TARGETS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          TARGETS
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.build.outputs.tag }}" \
            --title "Omni ${{ steps.build.outputs.tag }}" \
            --notes-file release-notes/${{ steps.build.outputs.version }}.md \
            dist/*
