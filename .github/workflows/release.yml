name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux-amd64:
    name: Release Linux x86_64 binary
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Build release archive
        id: build
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          name="omni_${version}_linux_amd64"
          mkdir -p dist/"$name"
          go build -trimpath -ldflags='-s -w' -o dist/"$name"/omni ./cmd/omni
          cp LICENSE dist/"$name"/LICENSE
          tar -C dist -czf dist/"$name".tar.gz "$name"
          sha256sum dist/"$name".tar.gz > dist/"$name".tar.gz.sha256
          printf 'tag=%s\nname=%s\n' "$tag" "$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.build.outputs.tag }}" \
            --title "Omni ${{ steps.build.outputs.tag }}" \
            --generate-notes \
            dist/${{ steps.build.outputs.name }}.tar.gz \
            dist/${{ steps.build.outputs.name }}.tar.gz.sha256
